# Kerneloscope menu configuration   (installed to \EFI\kerneloscope\menu.conf on the EFI partition)
#
#   timeout <seconds>          auto-boot countdown (0 = wait forever); starts after the intro
#   intro on|off               particle burst start-up animation (~4.5 s, any key skips it)
#   debug on|off               print diagnostics (preview only: on real hardware the text can flash over the menu)
#   resolution native|max|auto|WxH
#                              native (default) = the screen's own resolution read from its EDID
#                              (falls back to the largest mode if the firmware doesn't share the EDID);
#                              max = largest mode offered; auto = keep the firmware's mode (often lower, so blurry);
#                              e.g. 3440x1440 forces that mode if available.
#                              Any size and shape works (16:10, 16:9, 21:9, 32:9 super-ultrawide, 4K ...)
#   default "<entry title>"    entry selected at start
#   entry "<title>"            starts a main-screen icon; following lines belong to it:
#     icon <name>                theme icon: win, cachyos, bazzite, ubuntu, arch, linuxmint, pop, fedora, ... (os_<name>)
#     loader <\path\file.efi>    EFI file to start; every EFI partition on every drive is searched
#     options "<text>"           command line passed to the loader (Linux kernels: root=..., initrd=...)
#     sub "<title>"              an extra choice in this entry's TAB options list; may override
#       loader / options           (anything not overridden is inherited from the entry)
#
# Paths use backslashes and are relative to the root of the partition the file lives on.

resolution native
timeout 8
intro on
default "CachyOS"

entry "Windows 11"
  icon win
  loader \EFI\Microsoft\Boot\bootmgfw.efi

entry "CachyOS"
  icon cachyos
  loader \vmlinuz-linux-cachyos
  options "root=UUID=CHANGE-ME rw quiet splash initrd=\initramfs-linux-cachyos.img"
  sub "CachyOS (fallback initramfs)"
    options "root=UUID=CHANGE-ME rw initrd=\initramfs-linux-cachyos-fallback.img"
  sub "CachyOS (recovery shell)"
    options "root=UUID=CHANGE-ME rw single initrd=\initramfs-linux-cachyos.img"
  sub "rEFInd (classic menu)"
    loader \EFI\refind\refind_x64.efi
    options ""
